services:
  - type: web
    name: codebridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MODEL_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: EXECUTION_RUNNER_URL
        value: http://127.0.0.1:5000
      - key: DEFAULT_DEVICE
        value: cpu
